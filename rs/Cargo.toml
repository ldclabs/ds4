[package]
name = "ds4"
version = "0.1.0"
edition = "2021"
description = "DeepSeek V4 Flash inference engine - Rust port of ds4.c"
license = "MIT"

[features]
default = []
# Enable test-dimensions to use tiny constants for fast unit/integration testing
# without requiring an 81 GB model file.
test-dimensions = []

[[bin]]
name = "gen_test_gguf"
path = "src/bin/gen_test_gguf.rs"
required-features = ["test-dimensions"]

[[bin]]
name = "ds4-head-test"
path = "src/bin/ds4-head-test.rs"

[[bin]]
name = "ds4"
path = "src/bin/ds4.rs"

[dependencies]
memmap2 = "0.9"
bytemuck = { version = "1.18", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
